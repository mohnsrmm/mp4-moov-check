[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mp4-moov-check"
version = "1.0.0"
description = "Find out why an MP4 or MOV won't play: a missing moov atom (\"moov atom not found\"), a cut-off file or a broken index. Read-only."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "NasrTech" }]
keywords = ["mp4", "mov", "moov", "moov atom not found", "corrupted video", "video repair", "ffmpeg", "iso-bmff"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mohnsrmm/mp4-moov-check"
"Video Repair" = "https://www.nasrtech.dev/videorepair/?utm_source=github&utm_medium=pypi&utm_campaign=mp4-moov-check"

[project.scripts]
mp4-moov-check = "mp4_moov_check:main"

[tool.setuptools]
py-modules = ["mp4_moov_check"]
